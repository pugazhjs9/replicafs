name: ReplicaFS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check replicafs tests scripts
      - run: python -m ruff format --check replicafs tests scripts
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt --disable-pip --no-deps
      - run: docker compose config --quiet
      - run: bash -n scripts/demo_failover.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov=replicafs --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85

  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up -d --build --wait
      - run: bash scripts/demo_failover.sh
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
