[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.coverage.run]
source = ["replicafs"]
branch = true
parallel = true
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
